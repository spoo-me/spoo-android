[versions]
agp = "9.4.0"
kotlin = "2.4.10"
composeBom = "2026.08.00"
# M3 Expressive lives only in the 1.5.0 alphas; pinned over the BOM on purpose.
material3 = "1.5.0-alpha26"
activityCompose = "1.11.0"
navigation3 = "1.1.6"
coreKtx = "1.16.0"
lifecycle = "2.9.2"
kotlinxSerialization = "1.11.0"
spooSdk = "0.1.0"
coroutines = "1.10.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }
androidx-browser = { module = "androidx.browser:browser", version = "1.9.0" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version = "1.1.7" }
zxing-core = { module = "com.google.zxing:core", version = "3.5.3" }
materialkolor = { module = "com.materialkolor:material-kolor", version = "5.0.0" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version = "3.5.0" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version = "3.5.0" }
# 1.2 never went stable; the rc is what the ecosystem ships (see plan).
glance-appwidget = { module = "androidx.glance:glance-appwidget", version = "1.2.0-rc01" }
glance-material3 = { module = "androidx.glance:glance-material3", version = "1.2.0-rc01" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version = "2.10.3" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
junit = { module = "junit:junit", version = "4.13.2" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version = "1.2.1" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
spoo-sdk = { module = "me.spoo:spoo", version.ref = "spooSdk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
